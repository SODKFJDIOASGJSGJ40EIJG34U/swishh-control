name: Windows x64 build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis --ci

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWISHH-CONTROL-x64-Setup
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: "(github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish v0.1.2') || (startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v0.1.2')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          target_commitish: main
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
