<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">SWISHH CONTROL CENTER dashboard preview</title>
  <desc id="desc">Illustrative dashboard with placeholder system metrics. No real device information.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a20"/><stop offset="1" stop-color="#080c10"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d6df"/><stop offset="1" stop-color="#9272ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#16bed0" stop-opacity=".18"/><stop offset="1" stop-color="#16bed0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/><circle cx="720" cy="360" r="520" fill="url(#glow)"/>
  <rect x="18" y="18" width="236" height="784" rx="20" fill="#0c1117" stroke="#26323c"/>
  <rect x="38" y="38" width="42" height="42" rx="12" fill="url(#accent)"/><path d="M48 60h8l5-12 6 22 5-10h7" fill="none" stroke="#081116" stroke-width="3"/>
