    <rect x="292" y="194" width="535" height="202" rx="20"/><rect x="847" y="194" width="535" height="202" rx="20"/>
    <rect x="292" y="414" width="535" height="202" rx="20"/><rect x="847" y="414" width="535" height="202" rx="20"/>
