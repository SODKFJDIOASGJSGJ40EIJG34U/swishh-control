  <g font-family="Segoe UI,Arial"><g fill="#42d2dd"><text x="324" y="242" font-size="15" letter-spacing="1">PROCESSOR</text><text x="324" y="282" fill="#eaf1f5" font-size="25" font-weight="600">System load</text><text x="324" y="320" fill="#8997a3" font-size="15">Local reading · example</text><text x="324" y="365" fill="#eaf1f5" font-size="19">—</text></g><g fill="#aa8bff"><text x="879" y="242" font-size="15" letter-spacing="1">GRAPHICS</text><text x="879" y="282" fill="#eaf1f5" font-size="25" font-weight="600">Temperature</text><text x="879" y="320" fill="#8997a3" font-size="15">Local reading · example</text><text x="879" y="365" fill="#eaf1f5" font-size="19">—</text></g>
  <g fill="#e9f0f5"><text x="324" y="462" fill="#42d2dd" font-size="15" letter-spacing="1">MEMORY</text><text x="324" y="502" font-size="25" font-weight="600">Utilization</text><text x="324" y="540" fill="#8997a3" font-size="15">Live values appear on your device</text><text x="324" y="585" font-size="19">—</text><text x="879" y="462" fill="#aa8bff" font-size="15" letter-spacing="1">STORAGE</text><text x="879" y="502" font-size="25" font-weight="600">Available space</text><text x="879" y="540" fill="#8997a3" font-size="15">Local volumes · example</text><text x="879" y="585" font-size="19">—</text></g>
