  <g font-family="Segoe UI,Arial"><text x="292" y="72" fill="#98a8b4" font-size="13" letter-spacing="2">SWISHH  ·  LOCAL SYSTEM DASHBOARD</text><text x="292" y="128" fill="#f4f7fa" font-size="38" font-weight="650">Welcome back</text><text x="292" y="160" fill="#8997a3" font-size="17">A clear view of your PC at a glance.</text></g>
